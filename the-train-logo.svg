<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <defs>
    <linearGradient id="tunnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26241c"/>
      <stop offset="1" stop-color="#0b0b09"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d7174"/>
      <stop offset="0.5" stop-color="#a7abad"/>
      <stop offset="1" stop-color="#5f6366"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tunnel -->
  <rect width="240" height="180" fill="url(#tunnel)"/>
  <path d="M0 180 L96 120 M240 180 L144 120" stroke="#3a3830" stroke-width="2"/>
  <path d="M60 180 L108 120 M180 180 L132 120" stroke="#8a8578" stroke-width="2.5"/>

  <!-- station sign: black band, white line on top, line bullet -->
  <rect x="0" y="10" width="240" height="44" fill="#111"/>
  <rect x="0" y="13" width="240" height="2" fill="#f2f2f2"/>
  <circle cx="30" cy="35" r="13" fill="#fccc0a"/>
  <text x="30" y="41.5" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="18" text-anchor="middle" fill="#111">T</text>
  <text x="52" y="44" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="25" letter-spacing="0.5" fill="#f2f2f2">THE TRAIN</text>

  <!-- subway car front -->
  <rect x="78" y="66" width="84" height="104" rx="7" fill="url(#steel)"/>
  <rect x="78" y="66" width="84" height="104" rx="7" fill="none" stroke="#3c3f41" stroke-width="1.5"/>
  <!-- destination sign -->
  <rect x="96" y="72" width="48" height="11" rx="1.5" fill="#1a1308"/>
  <text x="120" y="80.5" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="7.5" text-anchor="middle" fill="#ffb02e">ROYAL SQ</text>
  <!-- windows and door -->
  <rect x="84" y="88" width="20" height="30" rx="2" fill="#1b2528"/>
  <rect x="136" y="88" width="20" height="30" rx="2" fill="#1b2528"/>
  <rect x="109" y="88" width="22" height="64" rx="2" fill="#4f5355" stroke="#3c3f41"/>
  <rect x="112" y="91" width="16" height="24" rx="1.5" fill="#1b2528"/>
  <!-- graffiti tag -->
  <path d="M84 134 q6 -12 12 -2 t10 -4" fill="none" stroke="#ff3f8e" stroke-width="3" stroke-linecap="round"/>
  <path d="M136 136 q5 -10 10 0 q4 -8 9 -3" fill="none" stroke="#2fd3e0" stroke-width="3" stroke-linecap="round"/>
  <!-- headlights -->
  <circle cx="91" cy="157" r="12" fill="url(#glow)"/>
  <circle cx="149" cy="157" r="12" fill="url(#glow)"/>
  <circle cx="91" cy="157" r="3.5" fill="#fff8dc"/>
  <circle cx="149" cy="157" r="3.5" fill="#fff8dc"/>
  <!-- bumper -->
  <rect x="80" y="166" width="80" height="4" fill="#2e3032"/>
</svg>
