<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Abort Mission logo">
<rect width="800" height="600" fill="#0b0f0c"/>
<rect x="30" y="30" width="740" height="540" fill="none" stroke="#2a6b43" stroke-width="3"/>
<g font-family="'Courier New', Courier, monospace" font-weight="bold" text-anchor="middle">
<text x="400" y="110" font-size="26" fill="#2a6b43" letter-spacing="6">DEFCON 1</text>
<text x="400" y="270" font-size="132" fill="#38ff7a" letter-spacing="4">ABORT</text>
<text x="400" y="400" font-size="108" fill="#38ff7a" letter-spacing="4">MISSION</text>
<text x="400" y="480" font-size="30" fill="#ff4545" letter-spacing="5">NUKES INBOUND</text>
<text x="400" y="535" font-size="22" fill="#ffb020" letter-spacing="3">ENTER CODE_</text>
</g>
<rect width="800" height="600" fill="url(#s)" opacity=".35"/>
<defs><pattern id="s" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.5" fill="#000"/></pattern></defs>
</svg>
