    <path d="M52 64 Q40 26 6 18 Q26 34 24 46 Q12 44 4 50 Q24 54 30 62 Q20 66 14 74 Q36 70 50 72Z"/>
    <path d="M60 62 Q78 22 116 12 Q98 30 100 42 Q112 38 122 42 Q104 50 96 58 Q106 62 112 70 Q88 66 66 72Z"/>
