<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1030"/>
      <stop offset="0.55" stop-color="#7a2a2a"/>
      <stop offset="1" stop-color="#e0803a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6a8"/>
      <stop offset="0.6" stop-color="#ffb35c" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff8a3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.4" stop-color="#ffa23a"/>
      <stop offset="1" stop-color="#d2361e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="240" height="180" fill="url(#sky)"/>
  <circle cx="168" cy="118" r="46" fill="url(#sun)"/>
  <!-- far mountains -->
  <path d="M0 140 L30 112 L52 126 L84 92 L112 122 L138 104 L170 132 L198 108 L240 136 L240 180 L0 180Z" fill="#3a1c26"/>
