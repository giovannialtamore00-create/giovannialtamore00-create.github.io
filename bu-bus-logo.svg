  <text x="104" y="50" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="40" fill="#f2c230" letter-spacing="3" stroke="#05060c" stroke-width="1.5" paint-order="stroke">BU BUS</text>
</svg>
