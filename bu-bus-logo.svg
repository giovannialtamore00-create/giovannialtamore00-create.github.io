    <polygon points="126,106 134,90 142,106"/>
    <rect x="133" y="82" width="2" height="9"/>
    <rect x="146" y="100" width="30" height="82"/>
    <rect x="176" y="92" width="22" height="90"/><rect x="184" y="84" width="6" height="8"/>
    <rect x="198" y="108" width="30" height="74"/>
    <rect x="228" y="118" width="22" height="64"/>
    <rect x="250" y="144" width="26" height="38"/>
