  <!-- street -->
  <rect y="180" width="320" height="60" fill="#1d1f25"/>
  <rect y="208" width="320" height="4" fill="#f2c230" opacity=".35"/>
  <!-- bus -->
  <g transform="translate(0,30)">
    <rect x="70" y="72" width="180" height="78" rx="6" fill="#f2c230"/>
    <rect x="70" y="128" width="180" height="8" fill="#16181d" opacity=".35"/>
    <rect x="84" y="84" width="30" height="26" fill="#ffe39a"/>
    <rect x="122" y="84" width="30" height="26" fill="#ffe39a"/>
    <rect x="160" y="84" width="30" height="26" fill="#ffe39a"/>
    <rect x="202" y="84" width="34" height="40" fill="#9ccbe0" opacity=".8"/>
