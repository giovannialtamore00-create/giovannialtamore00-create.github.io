    <rect x="6" y="148" width="3" height="3"/><rect x="14" y="160" width="3" height="3"/>
    <rect x="60" y="134" width="3" height="3"/><rect x="70" y="134" width="3" height="3"/><rect x="60" y="150" width="3" height="3"/><rect x="74" y="160" width="3" height="3"/>
    <rect x="88" y="118" width="3" height="3"/><rect x="96" y="128" width="3" height="3"/><rect x="152" y="106" width="3" height="3"/><rect x="166" y="112" width="3" height="3"/><rect x="180" y="98" width="3" height="3"/><rect x="190" y="110" width="3" height="3"/><rect x="204" y="114" width="3" height="3"/><rect x="218" y="122" width="3" height="3"/><rect x="234" y="124" width="3" height="3"/><rect x="108" y="128" width="3" height="3"/><rect x="114" y="140" width="3" height="3"/>
    <rect x="146" y="140" width="3" height="3"/><rect x="160" y="140" width="3" height="3"/><rect x="180" y="130" width="3" height="3"/><rect x="188" y="144" width="3" height="3"/>
    <rect x="204" y="146" width="3" height="3"/><rect x="216" y="146" width="3" height="3"/><rect x="234" y="138" width="3" height="3"/><rect x="242" y="150" width="3" height="3"/>
    <rect x="256" y="152" width="3" height="3"/><rect x="282" y="100" width="2" height="3"/><rect x="290" y="112" width="2" height="3"/><rect x="284" y="130" width="2" height="3"/>
    <rect x="294" y="146" width="2" height="3"/><rect x="308" y="144" width="3" height="3"/>
