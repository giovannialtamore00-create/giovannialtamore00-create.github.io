<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060c"/>
      <stop offset=".6" stop-color="#121a30"/>
      <stop offset="1" stop-color="#2a2540"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset=".45" stop-color="#e8e4d0" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#9aa6c8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#9aa6c8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="240" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#e8e4d0">
    <rect x="18" y="14" width="2" height="2"/><rect x="62" y="70" width="1.5" height="1.5"/><rect x="150" y="12" width="2" height="2"/>
    <rect x="188" y="40" width="1.5" height="1.5"/><rect x="300" y="18" width="2" height="2"/><rect x="304" y="110" width="1.5" height="1.5"/>
    <rect x="130" y="82" width="1.5" height="1.5"/><rect x="90" y="96" width="1.5" height="1.5"/><rect x="176" y="96" width="2" height="2"/>
    <rect x="12" y="92" width="1.5" height="1.5"/><rect x="284" y="130" width="1.5" height="1.5"/><rect x="200" y="12" width="1.5" height="1.5"/>
  </g>
  <!-- moon eclipsed by the black cube -->
  <circle cx="240" cy="62" r="64" fill="url(#halo)"/>
  <circle cx="240" cy="62" r="34" fill="#f1ecd8"/>
  <g stroke="#3a3f52" stroke-width=".8" stroke-linejoin="round">
