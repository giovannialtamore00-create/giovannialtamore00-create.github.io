    <rect x="22" y="96" width="32" height="27"/>
    <rect x="34" y="88" width="3" height="9"/><rect x="40" y="90" width="3" height="7"/>
    <!-- blocks -->
    <rect x="0" y="140" width="24" height="42"/>
    <rect x="54" y="128" width="28" height="54"/>
    <rect x="82" y="112" width="22" height="70"/>
    <rect x="104" y="120" width="18" height="62"/>
    <polygon points="104,120 113,110 122,120"/>
